<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raj Order Punch - Google Admin Sync</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="config.js"></script><style>body{font-family:system-ui,Segoe UI,Arial;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:35px auto;padding:0 16px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.07)}h1{margin-top:0}.warn{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;color:#9a3412}.ok{background:#ecfdf5;border:1px solid #a7f3d0;padding:12px;border-radius:10px;color:#065f46}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;background:#173b72;color:white;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:white;color:#173b72;border:1px solid #cbd5e1}button.danger{background:#b42318}button:disabled{opacity:.5}input[type=file]{display:block;margin:14px 0;padding:10px;border:1px solid #cbd5e1;border-radius:9px;width:100%;box-sizing:border-box}.prog{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#173b72;transition:.2s}.log{background:#111827;color:#d1fae5;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:360px;overflow:auto;font:12px ui-monospace,Consolas,monospace}.muted{color:#64748b;font-size:13px}code{background:#eef2f7;padding:2px 5px;border-radius:5px}</style></head><body><div class="wrap"><div class="card"><h1>Raj Order Punch · Google Admin Sync</h1><p class="muted">Excel master को Google Sheet backend में full-sync करता है. Fresh Sync चलाने पर <b>Products/Parties baseline replace</b> होगा; Product Master का Stock नया starting/live stock बन जाएगा.</p><div id="cfg" class="warn"></div><input id="file" type="file" accept=".xlsx,.xls"><div><button id="test">Test Google Backend</button><button id="read" class="secondary">Read Excel</button><button id="sync" disabled>Fresh Sync</button><button id="resume" class="secondary" disabled>Resume Saved Progress</button><button id="reset" class="danger">Reset Resume</button></div><div class="prog"><div id="bar" class="bar"></div></div><div id="stat" class="muted">Choose Excel first.</div><pre id="log" class="log">Ready.</pre></div></div><script>
const C=window.RAJ_CONFIG||{}, $=id=>document.getElementById(id);let products=[],parties=[];const PKEY='rajGoogleSyncProgressV1';
function log(s){$('log').textContent+='\n'+new Date().toLocaleTimeString()+'  '+s;$('log').scrollTop=$('log').scrollHeight}function conf(){return /^https:\/\/script\.google\.com\/macros\/s\//.test(String(C.APPS_SCRIPT_URL||''))}function pct(v){$('bar').style.width=Math.max(0,Math.min(100,v))+'%'}
$('cfg').className=conf()?'ok':'warn';$('cfg').innerHTML=conf()?'Apps Script URL configured.':'Paste deployed Web App URL in <code>config.js</code> first.';
function apiGet(params,timeout=30000){return new Promise((resolve,reject)=>{if(!conf())return reject(new Error('Apps Script URL not configured'));const cb='rajcb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const clean=()=>{try{delete window[cb]}catch{};s.remove()};const t=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Timeout'))},timeout);window[cb]=r=>{if(done)return;done=true;clearTimeout(t);clean();r?.ok?resolve(r):reject(new Error(r?.error||'Backend error'))};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);clean();reject(new Error('Could not reach Apps Script'))};const u=new URL(C.APPS_SCRIPT_URL);Object.entries({...params,callback:cb,_:Date.now()}).forEach(([k,v])=>u.searchParams.set(k,String(v)));s.src=u;document.head.appendChild(s)})}
function apiPost(action,payload={},timeout=90000){return new Promise((resolve,reject)=>{const requestId='adm_'+Date.now()+'_'+Math.random().toString(36).slice(2),iframe=document.createElement('iframe');iframe.name='if_'+requestId;iframe.style.display='none';document.body.appendChild(iframe);const f=document.createElement('form');f.method='POST';f.action=C.APPS_SCRIPT_URL;f.target=iframe.name;f.style.display='none';[['action',action],['requestId',requestId],['payload',JSON.stringify(payload)]].forEach(([n,v])=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i)});document.body.appendChild(f);let done=false;const clean=()=>{window.removeEventListener('message',on);f.remove();setTimeout(()=>iframe.remove(),200)},t=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Timeout'))},timeout);function on(e){const d=e.data;if(!d||d.source!=='RAJ_GAS'||d.requestId!==requestId)return;if(done)return;done=true;clearTimeout(t);clean();d.response?.ok?resolve(d.response):reject(new Error(d.response?.error||'Backend error'))}window.addEventListener('message',on);f.submit()})}
async function retry(fn,label){let e;for(let i=1;i<=4;i++){try{return await fn()}catch(err){e=err;log(label+' failed attempt '+i+': '+err.message);await new Promise(r=>setTimeout(r,1000*i))}}throw e}
async function readExcel(){const f=$('file').files[0];if(!f)throw new Error('Choose Excel file');log('Reading '+f.name+' ...');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',dense:true});const pws=wb.Sheets['Product Master']||wb.Sheets[wb.SheetNames[0]],qws=wb.Sheets['Party Master'];if(!qws)throw new Error('Party Master sheet not found');const pr=XLSX.utils.sheet_to_json(pws,{defval:'',raw:false});products=pr.map(r=>({Document:String(r.Document||''),GrpName:String(r.GrpName||''),Code:String(r.Code||'').trim(),Name:String(r.Name||''),Unit:String(r.Unit||''),HSNCode:String(r.HSNCode||''),GST:String(r.GST||''),MRP:String(r.MRP||''),HO_Rate:String(r.HO_Rate||''),Stock:Number(String(r.Stock??0).replace(/,/g,''))||0})).filter(r=>r.Code);const qr=XLSX.utils.sheet_to_json(qws,{defval:'',header:1,raw:false});parties=qr.slice(1).map(r=>String(r[0]||'').trim()).filter(Boolean);log('Products found: '+products.length.toLocaleString());log('Parties found: '+parties.length.toLocaleString());$('stat').textContent=`Ready: ${products.length.toLocaleString()} products · ${parties.length.toLocaleString()} parties`;$('sync').disabled=false;$('resume').disabled=!localStorage.getItem(PKEY);pct(0)}
async function doSync(fresh){if(!products.length||!parties.length)await readExcel();let prog=fresh?{phase:'products',index:0}:{phase:'products',index:0,...JSON.parse(localStorage.getItem(PKEY)||'{}')};if(fresh){log('Starting fresh backend sync...');await retry(()=>apiPost('beginSync',{productCount:products.length,partyCount:parties.length}),'beginSync');localStorage.setItem(PKEY,JSON.stringify(prog))}const PB=500,QB=1000;$('sync').disabled=$('resume').disabled=true;try{if(prog.phase==='products'){for(let i=prog.index||0;i<products.length;i+=PB){const rows=products.slice(i,i+PB);await retry(()=>apiPost('syncProducts',{offset:i,rows}),'Products '+i);prog={phase:'products',index:i+rows.length};localStorage.setItem(PKEY,JSON.stringify(prog));pct((prog.index/products.length)*80);$('stat').textContent=`Products ${Math.min(prog.index,products.length).toLocaleString()} / ${products.length.toLocaleString()}`;if(i%(PB*10)===0)log($('stat').textContent)}prog={phase:'parties',index:0};localStorage.setItem(PKEY,JSON.stringify(prog));}
for(let i=prog.index||0;i<parties.length;i+=QB){const rows=parties.slice(i,i+QB);await retry(()=>apiPost('syncParties',{offset:i,rows}),'Parties '+i);prog={phase:'parties',index:i+rows.length};localStorage.setItem(PKEY,JSON.stringify(prog));pct(80+(prog.index/parties.length)*19);$('stat').textContent=`Parties ${Math.min(prog.index,parties.length).toLocaleString()} / ${parties.length.toLocaleString()}`;log($('stat').textContent)}const r=await retry(()=>apiPost('finishSync',{productCount:products.length,partyCount:parties.length}),'finishSync');localStorage.removeItem(PKEY);pct(100);$('stat').textContent='SYNC COMPLETE';log('SYNC COMPLETE · backend products '+r.productRows+' · parties '+r.partyRows);$('resume').disabled=true}catch(e){log('STOPPED: '+e.message);$('stat').textContent='Sync stopped. Re-select same Excel and press Resume.';$('resume').disabled=false;throw e}finally{$('sync').disabled=false}}
$('test').onclick=async()=>{try{const r=await apiGet({action:'health'});log(`CONNECTION OK · ${r.name} · products ${r.productRows} · parties ${r.partyRows}`);$('stat').textContent='Google backend connection OK'}catch(e){log('CONNECTION ERROR: '+e.message);$('stat').textContent='Connection failed'}};$('read').onclick=()=>readExcel().catch(e=>log('ERROR: '+e.message));$('sync').onclick=()=>{if(confirm('Fresh Sync will replace Google Products/Parties baseline stock with this Excel. Continue?'))doSync(true).catch(()=>{})};$('resume').onclick=()=>doSync(false).catch(()=>{});$('reset').onclick=()=>{localStorage.removeItem(PKEY);$('resume').disabled=true;log('Resume progress reset')};$('file').onchange=()=>readExcel().catch(e=>log('ERROR: '+e.message));$('resume').disabled=!localStorage.getItem(PKEY);
</script></body></html>
